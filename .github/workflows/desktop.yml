name: Desktop

# App desktop (apps/desktop, Tauri). Fica fora do ci.yml para não pesar o CI principal:
# - PR que mexe em apps/desktop: Rust no Ubuntu (fmt, clippy, testes) + build do instalador no
#   Windows, sem publicar (o .exe sai como artefato do workflow para testar).
# - Tag `desktop-v*` (ex.: desktop-v0.1.0): build no Windows, GitHub Release com o instalador NSIS
#   e o latest.json do updater, e atualiza o release fixo `desktop-latest` (links estáveis).
# O release.yml (tags `v*`) não casa com `desktop-v*`, e vice-versa.
on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop.yml"
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  rust:
    name: Rust (fmt, clippy, testes) e TS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Dependências do sistema (webkit2gtk, appindicator)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@workspace/desktop..."
      - run: pnpm --filter @workspace/desktop typecheck
      - run: pnpm --filter @workspace/desktop test
      # O generate_context! do Tauri exige o frontendDist (dist/) na compilação.
      - run: pnpm --filter @workspace/desktop build:frontend
      - name: cargo fmt
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

  windows-build:
    name: Build Windows (sem publicar)
    if: github.event_name != 'push'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # Vazia = http://localhost:3000 (padrão de dev).
      ATLAS_URL: ${{ vars.ATLAS_DESKTOP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@workspace/desktop..."
      # Sem a chave do updater em PR: desliga os artefatos assinados só neste build.
      - name: tauri build (NSIS)
        run: pnpm --filter @workspace/desktop tauri build --bundles nsis --config src-tauri/tauri.unsigned.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-desktop-windows-${{ github.sha }}
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7
          if-no-files-found: error

  release:
    name: Release Windows
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
    needs: rust
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      ATLAS_URL: ${{ vars.ATLAS_DESKTOP_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Conferir tag, versão, chave pública e segredos
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          pkg_version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$version" != "$pkg_version" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não bate com apps/desktop/package.json ($pkg_version)."; exit 1
          fi
          if grep -q "SUBSTITUA_PELA_CHAVE_PUBLICA" apps/desktop/src-tauri/tauri.conf.json; then
            echo "::error::Coloque a chave pública do updater em apps/desktop/src-tauri/tauri.conf.json (ver apps/desktop/README.md)."; exit 1
          fi
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::Falta o segredo TAURI_SIGNING_PRIVATE_KEY no repositório."; exit 1
          fi
          case "$ATLAS_URL" in
            https://*) ;;
            *) echo "::error::Defina a variável de repositório ATLAS_DESKTOP_URL (https://...)."; exit 1 ;;
          esac
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@workspace/desktop..."
      # Cria o release antes (sem virar o "latest" do repositório, que é do Atlas web);
      # o tauri-action acha o release pela tag e só sobe os arquivos.
      - name: Criar o release da tag
        shell: bash
        run: |
          flags=""
          case "$VERSION" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "Atlas desktop $VERSION" --latest=false $flags \
            --notes "App desktop do Atlas para Windows 10/11. Instalador: \`*_x64-setup.exe\`. Sem assinatura de código: o Windows pode mostrar o SmartScreen (Mais informações → Executar assim mesmo). Atualizações verificadas pela chave do updater."
      - name: Build e upload (tauri-action)
        # v1.0.0, fixado por commit: a ação recebe a chave de assinatura.
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --bundles nsis
          tagName: ${{ github.ref_name }}
          releaseDraft: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
      # Links que não mudam entre versões: o updater lê desktop-latest/latest.json e a página de
      # download aponta para desktop-latest/Atlas_x64-setup.exe.
      - name: Atualizar o release fixo desktop-latest
        shell: bash
        run: |
          case "$VERSION" in *-*) echo "Pré-release ($VERSION): desktop-latest continua na versão estável."; exit 0 ;; esac
          mkdir -p out
          gh release download "$GITHUB_REF_NAME" --dir out --pattern "*_x64-setup.exe" --pattern "latest.json"
          setup=$(ls out/*_x64-setup.exe | head -n 1)
          cp "$setup" out/Atlas_x64-setup.exe
          notes="Sempre a versão mais recente do Atlas desktop (agora: $VERSION, release $GITHUB_REF_NAME). Links fixos para a página de download e para o updater."
          if ! gh release view desktop-latest > /dev/null 2>&1; then
            gh release create desktop-latest --title "Atlas desktop (última versão)" --latest=false --target "$GITHUB_SHA" --notes "$notes"
          fi
          gh release upload desktop-latest out/Atlas_x64-setup.exe out/latest.json --clobber
          gh release edit desktop-latest --notes "$notes" --latest=false
