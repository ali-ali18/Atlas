name: CI

on:
  push:
    branches: [main]
  pull_request:
    # release/**: os PRs entram primeiro no ramo da versão; só a versão inteira vai para a main.
    branches: [main, "release/**"]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_ENV: test
  ATLAS_HOOK_PEPPER: ci-test-pepper
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Typecheck e testes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: atlas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d atlas_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ATLAS_TEST_DB_URL: postgresql://test:test@localhost:5432/atlas_test
      DATABASE_URL: postgresql://test:test@localhost:5432/atlas_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/db exec prisma generate
      - name: Build das dependências (api, worker)
        run: pnpm exec turbo build --filter=api^... --filter=worker^...
      - name: Typecheck
        run: pnpm typecheck
      - name: Testes de packages, api, worker e web
        run: pnpm test:all
      - name: "Migrations do zero (migrate deploy + smoke — todas aplicam, sem erro)"
        # Pega erro de SQL em funções/gatilhos que só aparece ao aplicar. O banco do service container nasce vazio.
        run: pnpm --filter @workspace/db migrations:smoke
      - name: Testes do db (Postgres + pgvector, service container)
        run: pnpm --filter @workspace/db exec node ../../scripts/run-node-tests.mjs "src/**/*.test.ts"
      - name: Testes dos scripts (changelog)
        run: node --test scripts/changelog.test.mjs
      - name: Árvore limpa (generated.ts determinístico)
        run: git diff --exit-code

  e2e:
    name: E2E mobile (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/db exec prisma generate
      - run: pnpm exec turbo build --filter=web^...
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/e2e/report
