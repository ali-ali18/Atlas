name: APK Android

# Gera o APK do app mobile no runner do GitHub (`eas build --local`): sem fila e sem gastar a cota
# de builds do EAS. Credenciais de assinatura continuam remotas (EXPO_TOKEN).
# Tag `apk-*` (ex.: apk-0.3.0-beta.1): gera o APK e publica um GitHub Release com ele.
# "Run workflow" (manual): gera o APK e deixa como artifact; o botão só aparece depois que este
# arquivo estiver no branch padrão. Ver docs/features/apk-android-ci.md.
on:
  push:
    tags: ["apk-*"]
    # Commit com "[apk]" na mensagem em qualquer branch também gera o APK (útil quando quem dispara
    # não pode criar tag); o job abaixo pula os pushes sem a marca.
    branches: ["**"]
  workflow_dispatch:
    inputs:
      profile:
        description: "Perfil do eas.json (preview = canal preview, distribuição interna)"
        required: false
        default: preview
        type: string

concurrency:
  group: apk-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: Build do APK
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/apk-') || contains(github.event.head_commit.message, '[apk]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # só para anexar o APK ao GitHub Release (tag apk-*)
    env:
      PROFILE: ${{ inputs.profile || 'preview' }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CI: "1"
    steps:
      - name: Conferir EXPO_TOKEN e perfil
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error title=EXPO_TOKEN ausente::Crie o secret EXPO_TOKEN em Settings > Secrets and variables > Actions (token criado em expo.dev > Account settings > Access tokens). Ver docs/features/apk-android-ci.md."
            exit 1
          fi
          if ! printf '%s' "$PROFILE" | grep -Eq '^[A-Za-z0-9_-]+$'; then
            echo "::error title=Perfil inválido::Use só letras, números, - e _ (recebido um nome fora desse padrão)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # versão vem do packageManager da raiz

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache do Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - run: pnpm install --frozen-lockfile

      - name: Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-<não definido>}"
          test -d "${ANDROID_HOME:-/nonexistent}" || { echo "::error::Android SDK não encontrado no runner"; exit 1; }

      - name: Build local do APK (eas build --local)
        working-directory: apps/mobile
        run: >
          pnpm dlx eas-cli@27.4.1 build
          --local
          --platform android
          --profile "$PROFILE"
          --non-interactive
          --output "$GITHUB_WORKSPACE/atlas-$PROFILE.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: atlas-${{ env.PROFILE }}-apk
          path: atlas-${{ env.PROFILE }}.apk
          if-no-files-found: error
          retention-days: 14

      - name: GitHub Release com o APK
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          # Tag apk-*: usa a própria tag. Commit "[apk]": cria a tag apk-preview-<execução> neste commit
          # (tag criada pelo GITHUB_TOKEN não dispara outro workflow, então não há laço).
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('apk-{0}-{1}', env.PROFILE, github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('APK {0} - {1}', env.PROFILE, github.run_number) }}"
          files: atlas-${{ env.PROFILE }}.apk
          prerelease: true
          body: |
            APK Android do Atlas (build local no GitHub Actions).

            - Commit: ${{ github.sha }}
            - Perfil: `${{ env.PROFILE }}` (canal `preview`, distribuição interna)
            - Arquitetura: arm64-v8a (celulares atuais de 64 bits)

            Para instalar: baixe o arquivo `.apk` abaixo no celular e abra (pode ser preciso permitir "instalar apps desconhecidos"). Mudanças só de JavaScript chegam pelo ar (canal `preview`); mudou dependência nativa, gere um APK novo.
